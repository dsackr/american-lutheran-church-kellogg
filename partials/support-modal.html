<!-- Modal: Website Support & Feedback Ticket Dialog -->
  <dialog id="support-modal" aria-labelledby="support-modal-title">
    <div class="modal-header">
      <h3 id="support-modal-title">Website Support & Feedback</h3>
      <button type="button" class="modal-close-btn" aria-label="Close dialog">&times;</button>
    </div>
    <div class="modal-body">
      <div class="badge-page-context">
        <span>Current Page:</span> <span id="ticket-page-display">{{TICKET_PAGE}}</span>
      </div>
      <p style="margin-bottom: 1.25rem; font-size: 0.95rem; color: var(--color-slate);">
        Notice a typo, outdated service time, or want to suggest a change? Fill out this quick form and our <strong>ALC Support</strong> system will automatically create a ticket and update the site.
      </p>
      <form id="support-form">
        <input type="hidden" id="ticket-page-url" value="">
        <input type="hidden" id="ticket-page-title" value="">
        
        <div class="form-group">
          <label for="ticket-text" class="form-label">What would you like updated or fixed? *</label>
          <textarea id="ticket-text" class="form-control" rows="4" placeholder="{{TICKET_PLACEHOLDER}}" required></textarea>
        </div>

        <div class="form-group">
          <label for="ticket-name" class="form-label">Your Name (Optional)</label>
          <input type="text" id="ticket-name" class="form-control" placeholder="Your Name">
        </div>

        <div class="form-group">
          <label for="ticket-contact" class="form-label">Email or Phone (Optional, for follow-up)</label>
          <input type="text" id="ticket-contact" class="form-control" placeholder="your@email.com or phone number">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Support Ticket</button>
        </div>
      </form>
    </div>
  </dialog>
