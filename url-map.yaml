defaultService: https://www.googleapis.com/compute/v1/projects/openclaw-gateway-489207/global/backendServices/alc-kellogg-backend
name: alc-kellogg-urlmap
hostRules:
- hosts:
  - americanlutheranchurchkellogg.com
  pathMatcher: primary-matcher
- hosts:
  - alckellogg.com
  - www.alckellogg.com
  - www.americanlutheranchurchkellogg.com
